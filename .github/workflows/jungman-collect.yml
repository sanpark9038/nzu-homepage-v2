name: Jungman Collect

# 중만컵 득표 수집의 마지막 수단. 정기 수집은 Supabase Cron(3분)이 맡고,
# 그것도 뷰어 폴링도 죽었을 때 손으로 돌린다. 서버 쿨다운이 있어 자주 불러도 안전하다.
# 정기 실행이 필요해지면 아래에 schedule 트리거를 더하고 repo variable JUNGMAN_COLLECT_URL을 채운다.

on:
  workflow_dispatch:

concurrency:
  group: jungman-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      JUNGMAN_COLLECT_URL: ${{ vars.JUNGMAN_COLLECT_URL }}

    steps:
      - name: Poke collect endpoint
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${JUNGMAN_COLLECT_URL}" ]; then
            echo "JUNGMAN_COLLECT_URL repository variable is not set — nothing to do."
            echo "예: https://<사이트 도메인>/api/jungman/collect"
            exit 0
          fi

          response="$(
            curl --fail-with-body -sS -X POST "${JUNGMAN_COLLECT_URL}" \
              -H "content-type: application/json" \
              --data '{}'
          )"

          echo "$response"
          {
            echo "## 중만컵 수집"
            echo ""
            echo "- Response: \`$response\`"
          } >> "$GITHUB_STEP_SUMMARY"
