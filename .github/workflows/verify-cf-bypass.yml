name: Verify CF Bypass (one-off)

# 일회성 검증 전용. 수동 실행만. 파이프라인·스케줄과 무관하며 저장소 상태를 바꾸지 않는다.
# GitHub Actions(화면 없는 리눅스)에서 위장 크롬으로 엘로보드 CF 검문을 통과해 cf_clearance를
# 얻을 수 있는지만 확인한다. 검증이 끝나면 이 파일과 scripts/tools/verify-cf-bypass.js는 삭제한다.
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps (temporary, not committed)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i puppeteer-extra puppeteer-extra-plugin-stealth puppeteer >/dev/null 2>&1
          sudo apt-get update >/dev/null 2>&1
          sudo apt-get install -y xvfb >/dev/null 2>&1
      - name: Run CF bypass probe under virtual display
        run: xvfb-run -a --server-args="-screen 0 1280x900x24" node scripts/tools/verify-cf-bypass.js
